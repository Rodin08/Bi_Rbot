[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bi_rbot"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
  "gymnasium",
  "mujoco",
  "numpy",
  "stable-baselines3",
  "tensorboard",
  "tqdm",
  "rich",
]

[tool.setuptools.packages.find]
include = ["bi_rbot*"]

[tool.setuptools.package-data]
bi_rbot = ["assets/*.xml"]
